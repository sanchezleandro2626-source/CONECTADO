<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Monitoreo Full Stack</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 40px 20px; background: #f8f9fa; color: #333; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        .mensaje-item { background: #e9ecef; padding: 12px; margin: 10px 0; border-radius: 4px; border-left: 5px solid #007bff; }
        small { color: #6c757d; }
    </style>
</head>
<body>

    <h2>🛠️ Panel de Control (Escenario Real)</h2>
    
    <div class="card">
        <h3>Enviar reporte al Servidor</h3>
        <input type="text" id="inputAutor" placeholder="Tu nombre o rol (Ej: Desarrollador Leandro)">
        <textarea id="inputContenido" placeholder="Escribe el avance del código o reporte aquí..." rows="3"></textarea>
        <button id="btnEnviar">Guardar en Base de Datos</button>
    </div>

    <div class="card">
        <h3>Historial en MongoDB (Tiempo Real)</h3>
        <div id="listaMensajes">Cargando reportes...</div>
    </div>

    <script src="src/js/app.js"></script>
</body>
</html>
