<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Delivery Pro | Gestión Logística Avanzada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hubot+Sans:wght@400;600;800&family=Mona+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/estilos.css">
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <div class="logo-area">
                <span class="logo-icon">⚡</span>
                <h1>Urban Delivery <span class="badge-pro">PRO</span></h1>
            </div>
            <div class="tasa-bcv-badge" id="bcvBadge">
                <span class="indicator"></span> Tasa BCV: <strong id="tasaValor">Cargando...</strong>
            </div>
        </div>
    </header>

    <main class="app-container">
        
        <section class="panel-interactivo">
            
            <div class="card buscador-card">
                <label for="inputBusqueda">Explorar Catálogo Premium</label>
                <div class="search-wrapper">
                    <input type="text" id="inputBusqueda" placeholder="Buscar calzado, ropa, artículos..." autocomplete="off">
                    <span class="search-icon">🔍</span>
                </div>
            </div>

            <div class="productos-grid" id="productosGrid">
                </div>

            <div class="card checkout-card">
                <h2>Datos de Facturación y Entrega</h2>
                <form id="formCheckout" onsubmit="return false;">
                    
                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="txtNombre">Nombre del Cliente</label>
                            <input type="text" id="txtNombre" required placeholder="Ej. Alejandro Silva">
                        </div>
                        <div class="form-group">
                            <label for="txtTelefono">Teléfono de Contacto</label>
                            <input type="tel" id="txtTelefono" required placeholder="Ej. 04121234567">
                        </div>
                    </div>

                    <div class="form-group geo-box">
                        <label>Ubicación de Despacho Exacta</label>
                        <button type="button" id="btnGeolocalizar" class="btn-secondary">
                            <span class="icon">📍</span> Vincular Mi Ubicación GPS (Requerido)
                        </button>
                        <div id="geoEstatus" class="geo-status-waiting">
                            Ubicación no vinculada. Se requiere autorización GPS para calcular ruta.
                        </div>
                        <input type="text" id="txtDireccion" required placeholder="Punto de referencia detallado (Ej. Frente al CCCT, piso 2)">
                    </div>

                    <div class="form-group">
                        <label for="selectMetodoPago">Método de Pago</label>
                        <select id="selectMetodoPago" required>
                            <option value="PAGO_MOVIL">Pago Móvil (Bolívares al BCV)</option>
                            <option value="EFECTIVO_DIVISAS">Efectivo Divisas ($)</option>
                            <option value="ZELLE">Zelle ($)</option>
                        </select>
                    </div>

                    <div class="form-group hidden" id="grupoEfectivo">
                        <label for="selectBillete">¿Con qué billete pagará?</label>
                        <select id="selectBillete">
                            <option value="10">$10</option>
                            <option value="20">$20</option>
                            <option value="50">$50</option>
                            <option value="100">$100</option>
                        </select>
                    </div>

                    <button type="submit" id="btnProcesar" class="btn-primary" disabled>Procesar Orden de Entrega</button>
                </form>
            </div>

        </section>

        <section class="panel-monitoreo">
            <div class="card monitor-card">
                <div class="monitor-header">
                    <h2>Panel de Control Logístico</h2>
                    <span class="live-indicator">EN VIVO</span>
                </div>
                <p class="monitor-desc">Historial de órdenes procesadas en tiempo real en la red distribuida.</p>
                
                <div class="historial-pedidos" id="historialPedidos">
                    <div class="loading-box">Cargando flujo de datos logísticos...</div>
                </div>
            </div>
        </section>

    </main>

    <script src="src/js/app.js" type="module"></script>
</body>
</html>
